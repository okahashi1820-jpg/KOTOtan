<div id="app">
  <header id="hud">
    <div id="cnt"><div class="k">けした もじ</div><div class="v" id="cntNum">0</div></div>

  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
  </main>

  <div id="title" class="ov">
    <h1>KOTOtan</h1>
    <p class="tag">ひらがなを うかべて<br>3〜5もじの ことばを つくろう</p>
    <div id="diffs">
      <div class="drow"><button class="dtile" data-d="easy">かんたん</button><div class="dbub">ブロックがうかぶ時間はながく、消えやすいよ！</div></div>
      <div class="drow r"><button class="dtile" data-d="normal">ふつう</button><div class="dbub">ブロックがうかぶ時間はふつう、ちょっと消えやすいよ！</div></div>
      <div class="drow"><button class="dtile" data-d="hard">むずかしい</button><div class="dbub">ブロックがうかぶ時間はみじかいよ！ブロックの種類も増えたよ！</div></div>
      <div class="drow r"><button class="dtile" data-d="insane">げきむず</button><div class="dbub">ブロックがうかぶ時間はもっとみじかいよ！ブロックはもっと増えたよ！</div></div>
    </div>
    <button id="rptLinkT" class="lnk hide">ことばの ほうこく</button>
    <div class="credit" id="credit" data-sig="Shimako-KT-5a789510a89f"></div>
  </div>

  <div id="result" class="ov hidden">
    <h2>ゲームオーバー</h2>
    <div class="big" id="rScore">0</div>
    <div class="new hide" id="rNew">しんきろく！</div>
    <div class="rows"><b id="rDiff">-</b> の ベスト <b id="rBest">0</b><br>けした もじ <b id="rChars">0</b><br>いちばん ながい ことば <b id="rLong">-</b><br>さいだい れんさ <b id="rChain">0</b></div>

    <button id="diffBtn" class="btn sub2">なんいどを かえる</button>
    <button id="rptLinkR" class="lnk hide">ことばの ほうこく</button>
  </div>

  <div id="report" class="ov hidden">
    <h2>ことばの ほうこく</h2>
    <p class="tag">きえなかった ことばを きろくします<br>（この たんまつの なかだけに ほぞん）</p>
    <input id="rptRead" placeholder="よみ（ひらがな）" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="rptHyoki" placeholder="ひょうき（かんじ。なくても OK）" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="rptAdd" class="btn sm">きろくする</button>
    <div id="rptMsg"></div>
    <textarea id="rptList" readonly aria-label="きろくした ことば"></textarea>
    <div class="rptRow"><button id="rptCopy" class="btn sm">コピー</button><button id="rptClear" class="lnk">ぜんぶ けす</button><button id="rptClose" class="lnk">とじる</button></div>
  </div>
</div>
